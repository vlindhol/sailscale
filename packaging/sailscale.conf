# Sailscale ConnMan VPN plugin configuration (non-root privilege model).
#
# Installed by the RPM to /etc/connman/vpn-plugin/sailscale.conf. This runs the
# helper binary (tailscaled, spawned by the plugin) as the unprivileged `nemo`
# user with the `vpn` group and the bare-minimum supplementary groups a kernel
# VPN requires. There is no user-facing privilege step.
#
# Supplementary group `inet` permits AF_INET networking; `net_admin` carries
# CAP_NET_ADMIN so tailscaled can create and configure its tun interface and
# routes without a root shell.

[VPN Binary]
User = nemo
Group = vpn
SupplementaryGroups = inet,net_admin